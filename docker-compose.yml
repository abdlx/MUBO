services:
  mubo:
    build: .
    image: mubo:local
    container_name: mubo
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      MUSIC_PATH: /music
      LIBRARY_SCAN_INTERVAL_MS: ${LIBRARY_SCAN_INTERVAL_MS:-15000}
    volumes:
      - type: bind
        source: ${MUSIC_PATH:-./music}
        target: /music
        read_only: true
